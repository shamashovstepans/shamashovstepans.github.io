<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Asmdef Dependency Visualizer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: #2d2d2d;
            border-bottom: 1px solid #444;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px 10px 20px;
        }

        .header-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px 15px 20px;
            gap: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .header-right {
            display: flex;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .controls-section {
            display: flex;
            align-items: center;
            gap: 30px;
            flex: 1;
        }

        .file-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .viz-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .status-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .control-label {
            color: #ccc;
            margin-right: 10px;
            font-weight: 500;
        }

        .kofi-button {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            background: linear-gradient(135deg, #ff5f5f, #ff4757);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(255, 71, 87, 0.3);
        }

        .kofi-button:hover {
            background: linear-gradient(135deg, #ff4757, #ff3742);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(255, 71, 87, 0.4);
            color: white;
        }

        .kofi-text {
            display: flex;
            align-items: center;
            gap: 6px;
        }


        .file-input {
            padding: 8px 16px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .file-input:hover {
            background: #357abd;
        }

        .stats {
            font-size: 14px;
            color: #ccc;
        }

        .visualization-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #graph {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
        }

        .node {
            cursor: pointer;
            stroke: #333;
            stroke-width: 1.5px;
        }

        .node.highlighted {
            stroke: #ff6b35;
            stroke-width: 3px;
        }

        .node.dependency {
            stroke: #4a90e2;
            stroke-width: 2px;
        }

        .link {
            stroke: #666;
            stroke-opacity: 0.6;
            stroke-width: 1px;
        }

        .link.highlighted {
            stroke: #ff6b35;
            stroke-opacity: 1;
            stroke-width: 2px;
        }

        .link.dependency {
            stroke: #4a90e2;
            stroke-opacity: 0.8;
            stroke-width: 1.5px;
        }

        .node-label {
            font-size: 10px;
            fill: #ffffff;
            text-anchor: middle;
            pointer-events: none;
            font-family: 'Segoe UI', sans-serif;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #ccc;
        }

        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(45, 45, 45, 0.9);
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #ccc;
        }

        .error {
            color: #ff6b6b;
            font-size: 14px;
            margin-left: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .dependency-toggle {
            display: flex;
            gap: 15px;
            align-items: center;
            background: #3a3a3a;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }

        .dependency-toggle label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            color: #ccc;
            transition: color 0.2s;
        }

        .dependency-toggle label:hover {
            color: #fff;
        }

        .dependency-toggle input[type="radio"] {
            accent-color: #4a90e2;
        }

        .node-filters {
            display: flex;
            gap: 15px;
            align-items: center;
            background: #3a3a3a;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-top: 5px;
        }

        .node-filters label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            color: #ccc;
            transition: color 0.2s;
        }

        .node-filters label:hover {
            color: #fff;
        }

        .node-filters input[type="checkbox"] {
            accent-color: #4a90e2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- Top row: Title and Ko-fi button -->
            <div class="header-top">
                <div class="header-left">
                    <h1>Unity Asmdef Dependency Visualizer</h1>
                </div>
                <div class="header-right">
                    <a href="https://ko-fi.com/stepanshamashov" target="_blank" class="kofi-button">
                        <span class="kofi-text">☕ Support on Ko-fi</span>
                    </a>
                </div>
            </div>
            
            <!-- Bottom row: Controls and info -->
            <div class="header-bottom">
                <div class="controls-section">
                    <!-- File controls -->
                    <div class="file-controls">
                        <label for="folderInput" class="file-input">Select Unity Project Folder</label>
                        <input type="file" id="folderInput" webkitdirectory multiple>
                        <button id="reloadBtn" class="file-input" style="display: none;">Reload Project</button>
                        <button id="clearCacheBtn" class="file-input" style="display: none;">Clear Cache</button>
                        <button id="saveCacheBtn" class="file-input" style="display: none;">Save Cache to File</button>
                        <button id="loadCacheBtn" class="file-input" style="display: none;">Load Cache from File</button>
                    </div>
                    
                    <!-- Visualization controls -->
                    <div class="viz-controls">
                        <div class="dependency-toggle" id="dependencyToggle" style="display: none;">
                            <span class="control-label">Mode:</span>
                            <label>
                                <input type="radio" name="depType" value="both" checked> Both
                            </label>
                            <label>
                                <input type="radio" name="depType" value="outgoing"> Outgoing
                            </label>
                            <label>
                                <input type="radio" name="depType" value="incoming"> Incoming
                            </label>
                        </div>
                        
                        <div class="node-filters" id="nodeFilters" style="display: none;">
                            <span class="control-label">Show:</span>
                            <label>
                                <input type="checkbox" name="nodeFilter" value="Runtime" checked> Runtime
                            </label>
                            <label>
                                <input type="checkbox" name="nodeFilter" value="Game" checked> Game
                            </label>
                            <label>
                                <input type="checkbox" name="nodeFilter" value="Editor" checked> Editor
                            </label>
                            <label>
                                <input type="checkbox" name="nodeFilter" value="Tests" checked> Tests
                            </label>
                            <label>
                                <input type="checkbox" name="nodeFilter" value="Unity" checked> Unity
                            </label>
                            <label>
                                <input type="checkbox" name="nodeFilter" value="Third Party" checked> Third Party
                            </label>
                        </div>
                    </div>
                </div>
                
                <!-- Status section -->
                <div class="status-section">
                    <div class="stats" id="stats">No project loaded</div>
                    <div class="error" id="error"></div>
                </div>
            </div>
        </div>
        <div class="visualization-container">
            <div class="loading" id="loading" style="display: none;">Processing asmdef files...</div>
            <div class="controls">
                <div>Mouse: Pan & Zoom</div>
                <div>Click: Highlight Dependencies</div>
                <div>Double-click: Reset</div>
            </div>
            <svg id="graph"></svg>
        </div>
    </div>

    <script src="asmdef-parser.js"></script>
    <script src="debug-export.js"></script>
    <script src="visualizer.js"></script>
</body>
</html>
